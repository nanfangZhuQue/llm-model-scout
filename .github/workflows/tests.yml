name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
env:
  PYTHONUTF8: '1'
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Prepare Windows launcher environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m venv .venv
          (Resolve-Path .venv/Scripts).Path >> $env:GITHUB_PATH
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
      - run: python scripts/check_docs.py
      - run: python -m build
      - run: python examples/demo.py
      - name: Accept isolated wheel
        if: matrix.os != 'ubuntu-latest' || matrix.python != '3.12'
        run: python scripts/accept_wheel.py
      - name: Install browser tools
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python -m pip install -e ".[browser]"
      - name: Install Chromium
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python -m playwright install --with-deps chromium
      - name: Native browser regression
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python scripts/test_web_ui.py
      - name: Accept isolated wheel with browser
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python scripts/accept_wheel.py --browser
